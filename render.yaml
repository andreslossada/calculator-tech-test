services:
  - type: web
    name: calculator-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: ALLOWED_ORIGIN
        value: "http://localhost:5173,https://frontend-sand-eight-62.vercel.app"
