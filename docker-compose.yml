services:
  backend:
    build:
      context: ./backend
    container_name: calculator-backend
    environment:
      PORT: "8080"
      ALLOWED_ORIGIN: "http://localhost:5173"
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8080"
    container_name: calculator-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
